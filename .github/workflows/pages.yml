# 推送到 main 分支后，自动打包网页版并发布到 GitHub Pages
# 首次使用：仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」
name: 部署网页版

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 规则测试
        run: node server/test-rules.js
      - name: 打包网页版
        run: node web/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
