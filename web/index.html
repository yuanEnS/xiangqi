<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="网页版中国象棋：人机对战（入门 / 业余 / 大师）、本地双人、多套棋盘主题，打开即玩。">
<meta name="theme-color" content="#FBF6EE">
<title>象棋对战</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #E7E1D6; }
  #frame { position: relative; height: 100%; max-width: 480px; margin: 0 auto; background: #FBF6EE; box-shadow: 0 0 48px rgba(0,0,0,0.12); overflow: hidden; }
  canvas { display: block; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; }
  noscript { display: block; padding: 40px 20px; text-align: center; font: 16px sans-serif; }

  #toast { position: absolute; left: 50%; top: 45%; transform: translateX(-50%); padding: 10px 18px; border-radius: 8px;
    background: rgba(0,0,0,0.78); color: #fff; font: 15px sans-serif; white-space: nowrap; display: none; z-index: 20; }
  #toast.show { display: block; }

  .mask { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.4); font: 16px sans-serif; }
  .mask.sheet { align-items: flex-end; }
  .dlg { width: min(300px, calc(100% - 48px)); box-sizing: border-box; padding: 20px 16px 14px; border-radius: 12px; background: #fff; text-align: center; }
  .sheet .dlg { width: 100%; padding: 6px 0 10px; border-radius: 14px 14px 0 0; }
  .dlg-title { font-weight: bold; margin-bottom: 8px; color: #222; }
  .dlg-text { font-size: 15px; color: #555; margin-bottom: 14px; }
  .dlg-input { width: 100%; box-sizing: border-box; margin-bottom: 14px; padding: 10px; font-size: 20px; text-align: center; letter-spacing: 4px;
    border: 1px solid #ccc; border-radius: 8px; }
  .dlg-row { display: flex; gap: 10px; }
  .dlg-row button { flex: 1; padding: 11px; font-size: 16px; border: 1px solid #d0d0d0; border-radius: 8px; background: #fff; color: #333; cursor: pointer; }
  .dlg-row button.primary { background: #C62828; border-color: #C62828; color: #fff; }
  .sheet-item { display: block; width: 100%; padding: 15px; font-size: 17px; border: none; border-top: 1px solid #eee; background: #fff; color: #222; cursor: pointer; }
  .sheet-item:first-child { border-top: none; }
  .sheet-item.cancel { color: #888; border-top: 6px solid #f2f2f2; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="screen"></canvas>
</div>
<noscript>需要开启 JavaScript 才能下棋。</noscript>
<script src="wx-adapter.js"></script>
<script>XQ.boot('dist/game.js', 'dist/fonts/kai.ttf');</script>
</body>
</html>
