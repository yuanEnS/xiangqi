# Cloudflare Worker 配置。部署：npx wrangler login（首次）→ npx wrangler deploy
name = "xiangqi"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 正式地址 wss://api.gamesyuan.com（需要 gamesyuan.com 已经托管在 Cloudflare）。
# 原来的 xiangqi.yuanens.workers.dev 也继续可用。
workers_dev = true
routes = [{ pattern = "api.gamesyuan.com", custom_domain = true }]

# 账号、积分、排行榜。改表结构：加一个 migrations/ 文件，再运行
# npx wrangler d1 migrations apply gamesyuan --remote
[[d1_databases]]
binding = "DB"
database_name = "gamesyuan"
database_id = "1486a587-ad5a-43d0-9dfc-400f7b7aaad6"

# GOOGLE_CLIENT_ID 留空时不显示 Google 登录（它是公开信息，可以写在这里）。
# 邮箱登录要配置 Resend 密钥（不要写在这里）：npx wrangler secret put RESEND_API_KEY
[vars]
GOOGLE_CLIENT_ID = "548217929259-s8ufd3gfk6339jtrj3dqi3gprqgvj9h8.apps.googleusercontent.com"
MAIL_FROM = "游戏园 <noreply@gamesyuan.com>"
# 能写园中小记的账号：邮箱的 SHA-256，这样公开的代码里看不到邮箱
LIFE_ADMIN_EMAIL_HASH = "dff0947151d78882a409da914039507fd4064b9d82159cc1e5e63b3c7789e10d"

# 所有玩家连到同一个 Durable Object，里面保存房间和匹配队列
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyObject"

# 免费套餐只能用 SQLite 存储的 Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyObject"]
